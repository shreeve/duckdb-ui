#
# Builds the UI extension against DuckDB v2, which nothing else will build for
# us. DuckDB's registry publishes `ui` for every stable release and for every
# v2 nightly it builds extensions for -- but not this one:
#
#   http://extensions.duckdb.org/v2.0.0-alpha37432/osx_arm64/ui.duckdb_extension.gz  -> 404
#
# so a v2 binary has no UI unless someone builds it. That is what this is for.
#
# The DuckDB source is the `duckdb` submodule, not `duckdb_version` -- the
# reusable workflow checks this repository out with submodules and builds what
# it finds, and only uses duckdb_version for artifact names and cache keys. So
# the pin that decides what gets built is the submodule pointer (22226bba7f),
# and duckdb_version only has to agree with it in name. The version the
# extension is *stamped* with comes from OVERRIDE_GIT_DESCRIBE in the Makefile;
# see the note there for why it cannot be worked out automatically.
#
# Two architectures rather than the full matrix: these are the platforms a v2
# nightly is actually being run on here. Add to exclude_archs' complement when
# that changes.
name: Build for DuckDB v2

on:
  push:
    tags: ['v2-ui-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-v2-build:
    name: Build UI for DuckDB v2
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: ui
      ci_tools_version: main
      duckdb_version: v2.0.0-alpha37432
      exclude_archs: 'linux_arm64;linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64;windows_amd64_mingw;windows_arm64;wasm_mvp;wasm_eh;wasm_threads'
      # A release wants every binary that can be produced; one runner's bad day
      # should not cancel the other.
      reduced_ci_mode: 'disabled'
