#
# Builds the UI extension against DuckDB v2, which nothing else will build for
# us. DuckDB's registry publishes `ui` for every stable release and for every
# v2 nightly it builds extensions for -- but not this one:
#
#   http://extensions.duckdb.org/v2.0.0-alpha37626/osx_arm64/ui.duckdb_extension.gz  -> 404
#
# so a v2 binary has no UI unless someone builds it. That is what this is for.
#
# duckdb_version is a git ref, not a label. It travels as CI_DUCKDB_VERSION into
# ci_phase.py, which runs `make set_duckdb_version` -> `cd duckdb && git checkout
# $(DUCKDB_GIT_VERSION)`. Passing the runtime version string v2.0.0-alpha37626
# failed both builds in under a minute: DuckDB synthesises that name for its
# nightlies and there is no such ref to check out.
#
# So it is the commit, which is a ref that exists and is the one the submodule
# is already pinned to -- making the checkout a no-op that agrees with what is
# already there. The version the extension is *stamped* with is a separate
# thing entirely, and comes from OVERRIDE_GIT_DESCRIBE in the Makefile; see the
# note there for why it cannot be derived.
#
# Five native targets, matching what duckdb-harbor ships: linux amd64/arm64,
# osx arm64, windows amd64/arm64. It was two -- the platforms a v2 nightly was
# being run on at the time -- and the rest are here now so a v2 machine of any
# shape has a UI to load.
#
# What stays excluded and why. osx_amd64: Apple stopped selling Intel Macs in
# 2023, and Rosetta runs an arm64 DuckDB, which loads an arm64 extension.
# windows_amd64_mingw: redundant with the MSVC build. The musl pair: nobody has
# asked for Alpine. The three wasm targets: the UI serves HTTP from inside the
# process, which a browser sandbox cannot do.
#
# Unlike harbor, none of this can be short-cut by restamping one build for
# another version. Harbor is C_STRUCT_UNSTABLE -- Rust over the C API, never
# linking DuckDB -- so its payload does not depend on which DuckDB loads it.
# The UI is a CPP extension linked against DuckDB's internals, so every version
# and every platform is a real build.
name: Build for DuckDB v2

on:
  push:
    tags: ['v2-ui-*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duckdb-v2-build:
    name: Build UI for DuckDB v2
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: ui
      ci_tools_version: main
      duckdb_version: 7e14bd24e03f5b5c30b8f3af79a8fbb15dce8320
      exclude_archs: 'linux_amd64_musl;linux_arm64_musl;osx_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      # windows_arm64 is not in the default matrix and has to be asked for.
      opt_in_archs: 'windows_arm64'
      # A release wants every binary that can be produced; one runner's bad day
      # should not cancel the other.
      reduced_ci_mode: 'disabled'
